en:
  manage_members: "Manage members"

  theme_metadata:
    description: "Adds a Manage members button to private category pages, linking to the members page of the group that controls access to that category. Visible only to owners of that group."
    settings:
      group_name_prefix: "Text placed in front of the category slug to work out the group name. A category with the slug <code>design-team</code> and a prefix of <code>board-</code> looks for the group <code>board-design-team</code>. Leave blank to use the slug on its own."
      manage_url: "URL the button links to. <code>{group}</code> is replaced with the group name and <code>{slug}</code> with the category slug, so <code>/g/{group}</code> opens the group page. Absolute URLs are allowed. Leave blank to hide the button."
      plugin_outlet: "Where the button appears. Leave this as <code>auto</code> to place it above the topic list, or next to the New Topic button when the FKB Pro theme is active. Set a plugin outlet name to override the placement, for example <code>discovery-list-container-top</code> or <code>before-create-topic-button</code>."
